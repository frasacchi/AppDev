<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join China Hand — Beta Access</title>
<meta name="description" content="Request access to the China Hand beta.">
<!-- Instagram/social preview card -->
<meta property="og:title" content="Play China Hand — request beta access">
<meta property="og:description" content="Leave your name and email to get added. iPhone/iPad only.">
<meta property="og:image" content="icon.png">
<style>
  :root{
    --ink:#291a12; --parchment:#faf0d1; --parchment2:#eddbb2;
    --card-red:#d42e29; --gold:#f7c22e; --gold-deep:#c7851a; --cream:#fff7e0;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:28px 20px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;
    background:radial-gradient(circle at 50% 0%, #fdf6e3, #e8d9ab 75%);
    color:var(--ink);
  }
  .card{
    max-width:380px; width:100%; text-align:center;
    background:var(--parchment);
    border:3px solid var(--ink);
    border-radius:22px 16px 24px 14px/14px 24px 16px 22px;
    padding:30px 26px 26px;
    box-shadow:0 10px 0 rgba(41,26,18,.15);
  }
  .icon{
    width:104px; height:104px; border-radius:24px;
    border:3px solid var(--ink);
    box-shadow:2px 4px 0 rgba(41,26,18,.2);
    margin-bottom:14px;
  }
  h1{font-size:26px; margin:0 0 4px; letter-spacing:.01em}
  .sub{font-size:14.5px; opacity:.72; margin:0 0 22px; line-height:1.5; font-weight:600}
  .cta{
    display:block; width:100%; text-decoration:none; cursor:pointer;
    background:var(--gold); color:var(--ink); font-weight:800; font-size:18px;
    padding:15px 20px;
    border:3px solid var(--ink);
    border-radius:16px 11px 18px 10px/10px 18px 11px 16px;
    box-shadow:0 5px 0 var(--gold-deep);
    transition:transform .08s, box-shadow .08s;
    font-family:inherit;
  }
  .cta:active{transform:translateY(4px); box-shadow:0 1px 0 var(--gold-deep)}
  .cta:disabled{opacity:.6; cursor:default}
  .field{
    display:block; width:100%; font-size:16px; font-weight:700; color:var(--ink);
    font-family:inherit; padding:12px 14px; margin-bottom:10px;
    background:var(--cream);
    border:2.5px solid var(--ink);
    border-radius:12px 9px 13px 8px/8px 13px 9px 12px;
  }
  .field::placeholder{color:var(--ink); opacity:.4; font-weight:600}
  .field:focus{outline:3px solid var(--gold-deep); outline-offset:1px}
  /* Honeypot: kept in the DOM and in a real input so bots that fill every
     field still trip it, but placed off-screen (not display:none — that's
     too easy for less-lazy bots to detect and skip) and out of tab order so
     no real visitor ever notices or focuses it by accident. */
  .hp{position:absolute; left:-9999px; width:1px; height:1px; overflow:hidden}
  .result{
    margin-top:16px; font-size:14px; font-weight:700; line-height:1.5;
    padding:12px 14px; border-radius:10px 7px 11px 6px/6px 11px 7px 10px;
    display:none;
  }
  .result.ok{display:block; background:var(--cream); border:2px solid #2e8540; color:#1a5228}
  .result.err{display:block; background:var(--cream); border:2px solid var(--card-red); color:var(--card-red)}
  .note{
    margin-top:20px; font-size:12px; opacity:.55; font-weight:600; line-height:1.5;
  }
  .platform-warning{
    display:none; margin-top:16px; padding:10px 14px; font-size:13px; font-weight:700;
    background:var(--cream); border:2px solid var(--card-red); color:var(--card-red);
    border-radius:10px 7px 11px 6px/6px 11px 7px 10px;
  }
</style>
</head>
<body>

  <div class="card">
    <img class="icon" src="icon.png" alt="China Hand app icon">
    <h1>China Hand</h1>
    <p class="sub">Leave your name and email and I'll personally add you to the beta.</p>

    <form id="joinForm">
      <input class="field" type="text"  id="fName"  name="name"  placeholder="Your name"  autocomplete="name"  required>
      <input class="field" type="email" id="fEmail" name="email" placeholder="you@email.com" autocomplete="email" required>

      <!-- Honeypot. Real visitors never see or fill this. -->
      <input class="hp" type="text" name="botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">

      <!-- Sent with every submission so the notification email is easy to
           spot and filter. Web3Forms bundles every named field below into
           the email it sends you. -->
      <input type="hidden" name="subject" value="China Hand beta request">
      <!-- Replace WEB3FORMS_ACCESS_KEY with the key from web3forms.com —
           free, no login required, just an email to send the key to. -->
      <input type="hidden" name="access_key" value="WEB3FORMS_ACCESS_KEY">

      <button class="cta" type="submit" id="submitBtn">Request access</button>
    </form>

    <div class="result" id="result" role="status" aria-live="polite"></div>

    <div class="platform-warning" id="platformWarning">
      Looks like you're not on an iPhone or iPad — China Hand's beta is iOS only right now.
    </div>

    <p class="note">Free while in beta. I'll email you once you're added.</p>
  </div>

<script>
// A friendly heads-up for non-Apple visitors, since Instagram sends people
// from every device. This is now shown before they bother typing an email,
// since the whole point is not wasting their time on an iOS-only beta.
(function () {
  var ua = navigator.userAgent || "";
  var isAppleTouch = /iPhone|iPad|iPod/.test(ua) ||
                      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPadOS 13+ reports as Mac
  document.getElementById('platformWarning').style.display =
    isAppleTouch ? 'none' : 'block';
})();

// Submits straight to Web3Forms via fetch so the visitor never leaves this
// page — no redirect, no generic third-party confirmation screen. Falls
// back to a plain mailto link if the request fails for any reason (offline,
// the access key not yet configured, Web3Forms itself being down), so a
// failure never dead-ends someone who was ready to sign up.
(function () {
  var FALLBACK_EMAIL = "sacchi.appdev@outlook.com";
  var form = document.getElementById('joinForm');
  var btn = document.getElementById('submitBtn');
  var result = document.getElementById('result');
  var nameField = document.getElementById('fName');
  var emailField = document.getElementById('fEmail');
  // Explicit querySelector rather than form.botcheck / form.name shorthand:
  // a field literally named "name" collides with HTMLFormElement's own
  // native `name` attribute, so the ambiguous form[fieldName] access can't
  // be trusted here — this sidesteps that entirely.
  var honeypot = form.querySelector('[name=botcheck]');
  var accessKeyField = form.querySelector('[name=access_key]');
  var subjectField = form.querySelector('[name=subject]');

  function showResult(kind, html) {
    result.className = 'result ' + kind;
    result.innerHTML = html;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();

    // Honeypot: a real visitor can never have typed into a field they can't
    // see or tab to. If it's filled, silently drop the submission — no
    // error shown, so a bot gets no signal that it was caught.
    if (honeypot.value) return;

    var name = nameField.value.trim();
    var email = emailField.value.trim();
    if (!name || !email) return; // required attrs already stop this in practice

    btn.disabled = true;
    btn.textContent = 'Sending…';
    result.className = 'result';

    fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify({
        access_key: accessKeyField.value,
        subject: subjectField.value,
        name: name,
        email: email
      })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (res.ok && res.data && res.data.success) {
          form.style.display = 'none';
          showResult('ok', "Thanks, " + name.split(' ')[0] + "! You're on the list — I'll email you at " + email + " once you're added.");
        } else {
          throw new Error((res.data && res.data.message) || 'Submission failed');
        }
      })
      .catch(function () {
        showResult('err',
          "Something went wrong sending that. Mind emailing me directly instead? " +
          '<a href="mailto:' + FALLBACK_EMAIL + '?subject=China%20Hand%20beta%20request&body=Name%3A%20' +
          encodeURIComponent(name) + '%0AEmail%3A%20' + encodeURIComponent(email) + '">' +
          FALLBACK_EMAIL + '</a>');
        btn.disabled = false;
        btn.textContent = 'Request access';
      });
  });
})();
</script>

</body>
</html>
